<!DOCTYPE html>
<html lang="es" data-modo="oscuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F1411">
<title>PC de L1 y L2</title>
<link rel="icon" type="image/png" href="torre.png">
<script>
/* Fija la apariencia antes del primer pintado. Lee localStorage y, si no hay, cookie. */
(function(){
  function g(k){
    try{var v=localStorage.getItem(k); if(v)return v;}catch(e){}
    try{var m=document.cookie.match('(?:^|; )'+k+'=([^;]*)'); if(m)return decodeURIComponent(m[1]);}catch(e){}
    return null;
  }
  try{
    var m=g('pc_modo')||'sistema';
    var osc = m==='oscuro' || (m==='sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-modo', osc?'oscuro':'claro');
  }catch(e){document.documentElement.setAttribute('data-modo','oscuro');}
})();
</script>
<style>
/* ==================================================================
   PC de L1 y L2 · selector de método
   Mismo sistema de diseño que index1 e index2: mismos tokens,
   mismas formas, mismo interruptor de apariencia.
   ================================================================== */
:root{
  --r-cap:999px; --r-ico:14px; --r-card:20px; --r-box:26px;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,"Iowan Old Style",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
}
html,html[data-modo="oscuro"]{
  color-scheme:dark;
  --bg:#0F1411; --hondo:#0A0E0C; --panel:#171E1A; --panel2:#212B25;
  --line:rgba(233,238,231,.13); --line-viva:rgba(233,238,231,.26);
  --ink:#E9EEE7; --muted:#A4AFA6; --muted2:#7E887F;
  --crest:#E96A45; --gold:#E2B65F;
  --tinte-oro:rgba(226,182,95,.14); --tinte-neutro:rgba(233,238,231,.05);
  --velo:rgba(6,9,7,.66);
  --s1:0 1px 2px rgba(0,0,0,.3);
  --s2:0 6px 18px -8px rgba(0,0,0,.6);
  --s4:0 34px 80px -30px rgba(0,0,0,.9);
  --luz-interna:inset 0 1px 0 rgba(233,238,231,.06);
}
html[data-modo="claro"]{
  color-scheme:light;
  --bg:#EEF1EB; --hondo:#E6EAE3; --panel:#FDFEFB; --panel2:#FFFFFF;
  --line:rgba(21,28,24,.11); --line-viva:rgba(21,28,24,.24);
  --ink:#151C18; --muted:#556055; --muted2:#737D73;
  --crest:#B24019; --gold:#87621A;
  --tinte-oro:rgba(135,98,26,.09); --tinte-neutro:rgba(21,28,24,.035);
  --velo:rgba(26,32,28,.4);
  --s1:0 1px 2px rgba(24,31,26,.07);
  --s2:0 10px 24px -12px rgba(24,31,26,.18);
  --s4:0 36px 84px -34px rgba(24,31,26,.36);
  --luz-interna:inset 0 1px 0 rgba(255,255,255,.9);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.app-frame{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
.app-frame.active{display:block}

/* botón de menú: cuadrado redondeado, igual que los botones de icono de la app */
.menu-button{
  position:fixed;left:calc(11px + env(safe-area-inset-left));top:calc(11px + env(safe-area-inset-top));
  z-index:10020;width:44px;height:44px;padding:0;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--r-ico);
  background:var(--panel);color:var(--ink);
  box-shadow:var(--s2),var(--luz-interna);
  display:flex;align-items:center;justify-content:center;
  transition:transform .14s,border-color .2s,color .2s,background .2s
}
.menu-button:active{transform:scale(.94)}
.menu-button span,.menu-button:before,.menu-button:after{
  content:"";display:block;position:absolute;width:18px;height:1.7px;border-radius:2px;
  background:currentColor;transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .16s
}
.menu-button span{transform:translateY(0)}
.menu-button:before{transform:translateY(-6px)}
.menu-button:after{transform:translateY(6px)}
.menu-button.open{border-color:var(--crest);color:var(--crest)}
.menu-button.open span{opacity:0}
.menu-button.open:before{transform:rotate(45deg)}
.menu-button.open:after{transform:rotate(-45deg)}

.drawer-backdrop{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:10000;background:var(--velo);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s
}
.drawer-backdrop.open{opacity:1;visibility:visible}
.drawer{
  position:absolute;left:0;top:0;bottom:0;width:min(86vw,352px);
  display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line);
  box-shadow:var(--s4);
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding:calc(72px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom))
}
.drawer-backdrop.open .drawer{transform:translateX(0)}

.drawer-brand{
  display:flex;align-items:center;gap:12px;padding:0 2px 16px;margin-bottom:14px;
  border-bottom:1px solid var(--line);
  opacity:0;transform:translateX(-8px);transition:opacity .3s cubic-bezier(.2,.8,.2,1),transform .3s cubic-bezier(.2,.8,.2,1)
}
.drawer-backdrop.open .drawer-brand{opacity:1;transform:none}
.drawer-brand img{
  width:42px;height:42px;object-fit:contain;padding:6px;border-radius:var(--r-ico);
  background:var(--tinte-neutro);box-shadow:inset 0 0 0 1px var(--line)
}
.drawer-brand strong{display:block;font-family:var(--serif);font-size:1.3rem;font-weight:600;letter-spacing:-.01em;line-height:1.05}
.drawer-brand small{
  display:block;margin-top:5px;font-family:var(--mono);font-size:.58rem;font-weight:400;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)
}

/* interruptor de apariencia: idéntico al de los métodos */
.tema{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:var(--r-cap);background:var(--tinte-neutro);margin-bottom:16px;align-self:flex-start}
.tema button{
  width:34px;height:28px;padding:0;border:0;border-radius:var(--r-cap);background:transparent;
  color:var(--muted2);display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s
}
.tema button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tema button:hover{color:var(--ink)}
.tema button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:var(--s1)}

/* los dos métodos, como tarjetas */
.app-choice{
  position:relative;width:100%;margin:0 0 10px;cursor:pointer;text-align:left;touch-action:manipulation;
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;
  padding:16px 16px;
  border:1px solid var(--line);border-radius:var(--r-card);
  background:var(--tinte-neutro);color:var(--ink);
  font-family:var(--sans);font-size:1rem;font-weight:600;
  box-shadow:var(--s1);
  opacity:0;transform:translateX(-10px);
  transition:opacity .3s cubic-bezier(.2,.8,.2,1) .05s,transform .3s cubic-bezier(.2,.8,.2,1) .05s,
             background .18s,border-color .18s,box-shadow .18s
}
.drawer-backdrop.open .app-choice{opacity:1;transform:none}
.drawer-backdrop.open .app-choice[data-app="2"]{transition-delay:.11s}
.app-choice > span{display:block;min-width:0;font-family:var(--serif);font-size:1.16rem;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.app-choice br{display:none}
.app-choice small{
  display:block;margin-top:6px;font-family:var(--mono);font-size:.6rem;font-weight:400;
  letter-spacing:.1em;text-transform:uppercase;line-height:1.4;color:var(--muted2)
}
.app-choice:not(.active):hover{border-color:var(--line-viva);background:var(--panel2);box-shadow:var(--s2)}
.app-choice:not(.active):active{transform:scale(.995)}
.app-choice.active{
  border-color:var(--gold);background:var(--tinte-oro);box-shadow:var(--s1),0 0 0 1px var(--gold)
}
.app-choice.active > span{color:var(--gold)}
.app-choice.active:after{
  content:"activo";
  font-family:var(--mono);font-size:.56rem;font-weight:400;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);border:1px solid var(--gold);border-radius:var(--r-cap);padding:.3em .6em;white-space:nowrap
}
.drawer-note{
  margin:auto 2px 0;padding-top:18px;border-top:1px solid var(--line);
  color:var(--muted2);font-family:var(--mono);font-size:.61rem;line-height:1.8;letter-spacing:.05em;
  opacity:0;transform:translateX(-8px);
  transition:opacity .3s cubic-bezier(.2,.8,.2,1) .16s,transform .3s cubic-bezier(.2,.8,.2,1) .16s
}
.drawer-backdrop.open .drawer-note{opacity:1;transform:none}
.drawer-note:before{
  content:"";display:block;width:88px;height:10px;margin:0 0 14px;border-radius:1px;
  background-image:
    linear-gradient(90deg,transparent 55px,var(--crest) 55px 66px,transparent 66px),
    repeating-linear-gradient(90deg,var(--line-viva) 0 11px,transparent 11px 22px)
}
.menu-button:focus-visible,.app-choice:focus-visible,.tema button:focus-visible{outline:2px solid var(--crest);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

@media(max-width:480px){
  .menu-button{left:calc(8px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));width:41px;height:41px}
  .drawer{padding-left:15px;padding-right:15px;padding-top:calc(64px + env(safe-area-inset-top))}
  .drawer-brand strong{font-size:1.2rem}
}
@media(prefers-reduced-motion:reduce){
  .drawer,.drawer-backdrop,.drawer-brand,.drawer-note,.app-choice,
  .menu-button,.menu-button span,.menu-button:before,.menu-button:after{transition-duration:.01ms}
  .menu-button:active,.app-choice:active{transform:none}
}

/* ---- Tutorial de bienvenida (solo usuarios nuevos) ---- */
.tuto{position:fixed;inset:0;z-index:10990;pointer-events:none;display:none}
.tuto.open{display:block}
.tuto-velo{position:absolute;inset:0;background:rgba(6,9,7,.62);transition:opacity .25s}
.tuto.con-foco .tuto-velo{opacity:0}
.tuto-foco{position:absolute;border-radius:16px;box-shadow:0 0 0 9999px rgba(6,9,7,.62),0 0 0 3px var(--gold);transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1),height .35s cubic-bezier(.2,.8,.2,1),opacity .2s;opacity:0}
.tuto.con-foco .tuto-foco{opacity:1}
.tuto-foco:after{content:"";position:absolute;inset:-7px;border-radius:20px;border:2px solid var(--gold);animation:tutoPulso 1.6s ease-out infinite}
@keyframes tutoPulso{0%{opacity:.9;transform:scale(.97)}100%{opacity:0;transform:scale(1.08)}}
.tuto-mano{position:absolute;left:0;top:0;width:54px;height:54px;margin:-4px 0 0 -18px;font-size:46px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));opacity:0;transition:opacity .2s;will-change:transform}
.tuto-mano.ver{opacity:1}
.tuto-mano.toque{animation:tutoToque 1.25s ease-in-out infinite}
.tuto-mano.saludo{animation:tutoSaludo 1.6s ease-in-out infinite;transform-origin:60% 90%}
.tuto-mano.arrastre{animation:tutoArrastre 2.4s cubic-bezier(.45,.05,.3,1) infinite}
@keyframes tutoToque{0%,100%{transform:translate(var(--x),var(--y)) scale(1)}45%{transform:translate(var(--x),calc(var(--y) + 10px)) scale(.86)}60%{transform:translate(var(--x),calc(var(--y) + 10px)) scale(.86)}}
@keyframes tutoSaludo{0%,100%{transform:translate(var(--x),var(--y)) rotate(0)}25%{transform:translate(var(--x),var(--y)) rotate(-16deg)}75%{transform:translate(var(--x),var(--y)) rotate(16deg)}}
@keyframes tutoArrastre{0%{transform:translate(var(--x),var(--y)) scale(1);opacity:0}10%{opacity:1}22%{transform:translate(var(--x),calc(var(--y) + 8px)) scale(.86)}70%{transform:translate(var(--x2),calc(var(--y2) + 8px)) scale(.86);opacity:1}85%{transform:translate(var(--x2),var(--y2)) scale(1);opacity:1}100%{transform:translate(var(--x2),var(--y2)) scale(1);opacity:0}}
.tuto-ficha{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9d4c6);box-shadow:0 6px 14px rgba(0,0,0,.4);display:grid;place-items:center;font-size:26px;color:#1b1b1b;opacity:0}
.tuto-ficha.ver{animation:tutoFicha 2.4s cubic-bezier(.45,.05,.3,1) infinite}
@keyframes tutoFicha{0%,20%{transform:translate(var(--x),var(--y));opacity:0}24%{opacity:.95}70%{transform:translate(var(--x2),var(--y2));opacity:.95}85%,100%{transform:translate(var(--x2),var(--y2));opacity:0}}
.tuto-card{position:absolute;left:50%;width:min(92vw,400px);transform:translateX(-50%);pointer-events:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line-viva);border-radius:var(--r-box);box-shadow:var(--s4);padding:18px 18px 14px;transition:top .3s cubic-bezier(.2,.8,.2,1),bottom .3s cubic-bezier(.2,.8,.2,1)}
.tuto-card.abajo{bottom:calc(18px + env(safe-area-inset-bottom));top:auto}
.tuto-card.arriba{top:calc(66px + env(safe-area-inset-top));bottom:auto}
.tuto-card.centro{top:50%;bottom:auto;transform:translate(-50%,-50%)}
.tuto-paso{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.tuto-card h3{font-family:var(--serif);font-size:1.28rem;font-weight:600;letter-spacing:-.01em;margin:.35rem 0 .45rem}
.tuto-card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.5}
.tuto-puntos{display:flex;gap:6px;margin:14px 0 12px}
.tuto-puntos i{width:7px;height:7px;border-radius:50%;background:var(--line-viva);transition:background .2s,width .2s}
.tuto-puntos i.on{background:var(--gold);width:20px;border-radius:4px}
.tuto-acciones{display:flex;gap:8px;align-items:center}
.tuto-acciones button{min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--tinte-neutro);color:var(--ink);font:600 .85rem var(--sans);padding:0 14px;cursor:pointer;touch-action:manipulation}
.tuto-acciones .tuto-sig{background:var(--gold);border-color:var(--gold);color:#1a1408;margin-left:auto}
.tuto-acciones .tuto-cerrar{background:transparent;color:var(--muted)}
.tuto-acciones button:disabled{opacity:.35}
.drawer-tuto{margin:4px 2px 0;align-self:flex-start;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:var(--r-cap);padding:.45rem .9rem;font:600 .78rem var(--sans);cursor:pointer}
.drawer-tuto:hover{color:var(--ink);border-color:var(--line-viva)}
@media(prefers-reduced-motion:reduce){.tuto-mano,.tuto-ficha,.tuto-foco:after{animation-duration:3s}}
</style>

<body>
<button class="menu-button" id="menu-button" type="button" aria-label="Abrir menú" aria-expanded="false"><span></span></button>
<div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true">
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Elegir aplicación">
    <div class="drawer-brand">
      <img src="torre.png" alt="Ajedrez">
      <div><strong>PC de L1 y L2</strong><small>Dos métodos en una aplicación</small></div>
    </div>
    <div class="tema" id="tema" role="group" aria-label="Apariencia">
      <button type="button" data-modo="claro" aria-pressed="false" title="Claro" aria-label="Apariencia: Claro"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M5.9 5.9l1.5 1.5M16.6 16.6l1.5 1.5M18.1 5.9l-1.5 1.5M7.4 16.6l-1.5 1.5"/></svg><span class="sr">Claro</span></button>
      <button type="button" data-modo="oscuro" aria-pressed="false" title="Oscuro" aria-label="Apariencia: Oscuro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13.1A8.3 8.3 0 1 1 11 3.2a6.6 6.6 0 0 0 9.8 9.9z"/></svg><span class="sr">Oscuro</span></button>
      <button type="button" data-modo="sistema" aria-pressed="false" title="Como el sistema" aria-label="Apariencia: Como el sistema"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="4.8" width="17.6" height="11.6" rx="1.7"/><path d="M8.6 19.6h6.8"/></svg><span class="sr">Sistema</span></button>

<script>
(function(){
  var menuButton=document.getElementById('menu-button');
  var backdrop=document.getElementById('drawer-backdrop');
  var activeApp='1';

  function impedirZoom(e){e.preventDefault();}
  document.addEventListener('gesturestart',impedirZoom,{passive:false});
  document.addEventListener('gesturechange',impedirZoom,{passive:false});
  document.addEventListener('gestureend',impedirZoom,{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});

  function setDrawer(open){
    backdrop.classList.toggle('open',open);
    menuButton.classList.toggle('open',open);
    menuButton.setAttribute('aria-expanded',open?'true':'false');
    backdrop.setAttribute('aria-hidden',open?'false':'true');
    if(open) aplicarModo();
  }
  function selectApp(id){
    activeApp=String(id);
    var frames=document.querySelectorAll('.app-frame');
    for(var i=0;i<frames.length;i++) frames[i].classList.remove('active');
    var frame=document.getElementById('app-frame-'+activeApp);
    if(frame) frame.classList.add('active');
    var choices=document.querySelectorAll('.app-choice');
    for(var j=0;j<choices.length;j++) choices[j].classList.toggle('active',choices[j].getAttribute('data-app')===activeApp);
    try{localStorage.setItem('pc_l3_active_app',activeApp);}catch(e){}
    try{document.cookie='pc_l3_active_app='+activeApp+';path=/;max-age=63072000;SameSite=Lax';}catch(e){}
    setDrawer(false);
  }
  menuButton.onclick=function(){setDrawer(!backdrop.classList.contains('open'));};
  backdrop.onclick=function(e){if(e.target===backdrop)setDrawer(false);};
  var choices=document.querySelectorAll('.app-choice');
  for(var i=0;i<choices.length;i++) choices[i].onclick=function(){selectApp(this.getAttribute('data-app'));};
  var guardado=null;
  try{guardado=localStorage.getItem('pc_l3_active_app');}catch(e){}
  if(!guardado) guardado=galleta('pc_l3_active_app');
  if(guardado==='2') selectApp('2');

  /* ---- apariencia: misma clave que los métodos, así los tres van a una ---- */
  var raiz=document.documentElement, K='pc_modo';
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  function galleta(k){try{var m=document.cookie.match('(?:^|; )'+k+'=([^;]*)');return m?decodeURIComponent(m[1]):null}catch(e){return null}}
  function leerModo(){
    var v=null;
    try{ v=localStorage.getItem(K); }catch(e){}
    if(!v) v=galleta(K);
    return v||'sistema';
  }
  function guardarModo(v){
    try{ localStorage.setItem(K,v); }catch(e){}
    try{ document.cookie=K+'='+encodeURIComponent(v)+';path=/;max-age=63072000;SameSite=Lax'; }catch(e){}
  }
  var modo=leerModo();
  function aplicarModo(){
    modo=leerModo();
    if(['claro','oscuro','sistema'].indexOf(modo)<0) modo='sistema';
    var oscuro = modo==='oscuro' || (modo==='sistema' && mq.matches);
    raiz.setAttribute('data-modo', oscuro?'oscuro':'claro');
    var bs=document.querySelectorAll('#tema button');
    for(var i=0;i<bs.length;i++) bs[i].setAttribute('aria-pressed', String(bs[i].getAttribute('data-modo')===modo));
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', oscuro?'#0F1411':'#ECEFE9');
  }
  var bt=document.querySelectorAll('#tema button');
  for(var t=0;t<bt.length;t++){
    bt[t].onclick=function(){
      guardarModo(this.getAttribute('data-modo'));
      aplicarModo();
      /* avisa a los métodos ya cargados */
      var frames=document.querySelectorAll('.app-frame');
      for(var i=0;i<frames.length;i++){
        try{ if(frames[i].contentWindow) frames[i].contentWindow.dispatchEvent(new StorageEvent('storage',{key:K})); }catch(e){}
      }
    };
  }
  if(mq.addEventListener) mq.addEventListener('change',function(){ if(modo==='sistema') aplicarModo(); });
  else if(mq.addListener) mq.addListener(function(){ if(modo==='sistema') aplicarModo(); });
  window.addEventListener('storage',function(e){ if(!e||!e.key||e.key===K) aplicarModo(); });
  aplicarModo();

  /* Reenvía al método activo las respuestas del selector, portapapeles y guardado nativo. */
  window.pcAndroidResultadoBase64=function(tipoBase64,datoBase64){
    var frame=document.getElementById('app-frame-'+activeApp);
    try{
      if(frame && frame.contentWindow && typeof frame.contentWindow.pcAndroidResultadoBase64==='function'){
        frame.contentWindow.pcAndroidResultadoBase64(tipoBase64,datoBase64);
      }
    }catch(e){}
  };

  window.PC_ANDROID_BACK=function(){
    if(backdrop.classList.contains('open')){setDrawer(false);return true;}
    var frame=document.getElementById('app-frame-'+activeApp);
    try{
      if(frame && frame.contentWindow && typeof frame.contentWindow.PC_ANDROID_BACK==='function'){
        frame.contentWindow.PC_ANDROID_BACK();
        return true;
      }
    }catch(e){}
    return true;
  };

  function bloquearZoomFrame(frame){
    try{
      var doc=frame&&frame.contentDocument;
      if(!doc||!doc.documentElement||doc.documentElement.dataset.zoomBloqueado)return;
      var meta=doc.querySelector('meta[name="viewport"]');
      if(meta) meta.setAttribute('content','width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
      doc.addEventListener('gesturestart',impedirZoom,{passive:false});
      doc.addEventListener('gesturechange',impedirZoom,{passive:false});
      doc.addEventListener('gestureend',impedirZoom,{passive:false});
      doc.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
      doc.documentElement.dataset.zoomBloqueado='1';
    }catch(e){}
  }

  function bloquearScrollHorizontalFrame(frame){
    try{
      var doc=frame&&frame.contentDocument;
      var win=frame&&frame.contentWindow;
      if(!doc||!doc.documentElement||doc.documentElement.dataset.scrollHorizontalBloqueado)return;
      doc.documentElement.style.overflowX='hidden';
      doc.documentElement.style.maxWidth='100%';
      doc.documentElement.style.overscrollBehaviorX='none';
      doc.documentElement.style.touchAction='pan-y';
      if(doc.body){
        doc.body.style.overflowX='hidden';
        doc.body.style.maxWidth='100%';
        doc.body.style.overscrollBehaviorX='none';
        doc.body.style.touchAction='pan-y';
      }
      if(win) win.addEventListener('scroll',function(){if(win.scrollX!==0)win.scrollTo(0,win.scrollY);},{passive:true});
      doc.documentElement.dataset.scrollHorizontalBloqueado='1';
    }catch(e){}
  }

  function mostrarControlesAnalisisSiempre(frame){
    try{
      var doc=frame&&frame.contentDocument;
      var win=frame&&frame.contentWindow;
      if(!doc||!doc.head||!win)return;
      var anterior=doc.getElementById('b-ana-prev');
      var siguiente=doc.getElementById('b-ana-next');
      var droidfish=doc.getElementById('b-edit');
      var tablero=doc.getElementById('board');
      if(!anterior||!siguiente||!droidfish)return;
      if(!doc.getElementById('controles-analisis-siempre-visibles')){
        var estilo=doc.createElement('style');
        estilo.id='controles-analisis-siempre-visibles';
        estilo.textContent='#b-ana-prev,#b-ana-next{display:flex!important;visibility:visible!important;transition:opacity .22s ease,filter .22s ease!important;}#b-ana-prev[data-historial-apagado="1"],#b-ana-next[data-historial-apagado="1"]{opacity:.34!important;filter:saturate(.35);cursor:default;}#b-ana-prev[data-historial-apagado="0"],#b-ana-next[data-historial-apagado="0"]{opacity:1!important;filter:none;}';
        doc.head.appendChild(estilo);
      }
      if(typeof win.__pcEstadoHistorialFlechas!=='function'){
        var puente=doc.createElement('script');
        puente.textContent='window.__pcEstadoHistorialFlechas=function(){try{return{ejercicio:String(state.filter)+"|"+String(state.i)+"|"+String(state.fen),historial:Array.isArray(state.anaMoves),ptr:Number(state.anaPtr)||0,total:Array.isArray(state.anaMoves)?state.anaMoves.length:0};}catch(e){return null;}};';
        doc.documentElement.appendChild(puente);
        puente.remove();
      }
      function estadoHistorial(){
        try{return typeof win.__pcEstadoHistorialFlechas==='function'?win.__pcEstadoHistorialFlechas():null;}catch(e){return null;}
      }
      function prepararEjercicio(estado){
        var raiz=doc.documentElement;
        if(raiz.dataset.historialEjercicio!==estado.ejercicio){
          raiz.dataset.historialEjercicio=estado.ejercicio;
          raiz.dataset.droidfishIniciado='0';
        }
        return raiz;
      }
      function pintar(boton,activo){
        boton.setAttribute('data-historial-apagado',activo?'0':'1');
        boton.setAttribute('aria-disabled',activo?'false':'true');
      }
      function sincronizarFlechas(){
        var estado=estadoHistorial();
        if(!estado)return;
        var raiz=prepararEjercicio(estado);
        var disponible=estado.historial;
        pintar(anterior,disponible&&estado.ptr>0);
        pintar(siguiente,disponible&&estado.ptr<estado.total);
      }
      function programarSincronizacion(){win.requestAnimationFrame(sincronizarFlechas);}
      function bloquearSiApagado(e){
        if(this.getAttribute('data-historial-apagado')==='1'){
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }
      if(!anterior.dataset.controlHistorialFlechas){
        anterior.addEventListener('click',bloquearSiApagado,true);
        siguiente.addEventListener('click',bloquearSiApagado,true);
        anterior.addEventListener('click',programarSincronizacion);
        siguiente.addEventListener('click',programarSincronizacion);
        anterior.dataset.controlHistorialFlechas='1';
        siguiente.dataset.controlHistorialFlechas='1';
      }
      if(!droidfish.dataset.activacionVisualFlechas){
        droidfish.addEventListener('click',function(){
          win.requestAnimationFrame(function(){
            var estado=estadoHistorial();
            if(!estado)return;
            var raiz=prepararEjercicio(estado);
            if(estado.historial)raiz.dataset.droidfishIniciado='1';
            sincronizarFlechas();
          });
        });
        droidfish.dataset.activacionVisualFlechas='1';
      }
      if(tablero&&!tablero.dataset.observaHistorialFlechas){
        new win.MutationObserver(programarSincronizacion).observe(tablero,{childList:true,subtree:true});
        tablero.dataset.observaHistorialFlechas='1';
      }
      sincronizarFlechas();
    }catch(e){}
  }

  function fijarTamanoBotonDroidfish(frame){
    requestAnimationFrame(function(){
      try{
        var doc=frame&&frame.contentDocument;
        var boton=doc&&doc.getElementById('b-edit');
        if(!boton||boton.dataset.tamanoDroidfishFijo)return;
        var fila=boton.parentElement;
        var ids=['b-reset','b-edit','b-anotar','b-ana-prev','b-ana-next'];
        if(fila){
          fila.style.gap='.3rem';
          fila.style.alignItems='center';
          fila.style.justifyContent='center';
        }
        for(var i=0;i<ids.length;i++){
          var b=doc.getElementById(ids[i]);
          if(!b)continue;
          b.style.flex='0 0 calc((100% - 1.2rem)/5)';
          b.style.width='calc((100% - 1.2rem)/5)';
          b.style.minWidth='0';
          b.style.maxWidth='calc((100% - 1.2rem)/5)';
          b.style.height='2.55rem';
          b.style.minHeight='2.55rem';
          b.style.maxHeight='2.55rem';
          b.style.padding='0 .16rem';
          b.style.fontSize='clamp(.66rem,2.85vw,.88rem)';
          b.style.lineHeight='1';
          b.style.gap='.22rem';
          b.style.whiteSpace='nowrap';
          b.style.overflow='hidden';
          b.style.justifyContent='center';
          b.style.alignItems='center';
          b.style.alignSelf='center';
          b.style.boxSizing='border-box';
          if((ids[i]==='b-ana-prev'||ids[i]==='b-ana-next')&&b.querySelector('svg')){
            b.querySelector('svg').style.width='1.55rem';
            b.querySelector('svg').style.height='1.55rem';
          }
        }
        function ajustarContenidoDroidfish(){
          var esDroidfish=!!boton.querySelector('svg');
          boton.style.fontSize=esDroidfish?'clamp(.62rem,2.6vw,.82rem)':'clamp(.66rem,2.85vw,.88rem)';
          boton.style.gap=esDroidfish?'.16rem':'.22rem';
          var icono=boton.querySelector('svg');
          if(icono){
            icono.style.width='.88rem';
            icono.style.height='.88rem';
            icono.style.flex='0 0 .88rem';
          }
        }
        ajustarContenidoDroidfish();
        if(!boton.dataset.ajusteVisualDroidfish){
          new MutationObserver(ajustarContenidoDroidfish).observe(boton,{childList:true});
          boton.dataset.ajusteVisualDroidfish='1';
        }
        boton.dataset.tamanoDroidfishFijo='1';
      }catch(e){}
    });
  }
  var appFrames=document.querySelectorAll('.app-frame');
  for(var f=0;f<appFrames.length;f++) appFrames[f].addEventListener('load',function(){bloquearZoomFrame(this);bloquearScrollHorizontalFrame(this);mostrarControlesAnalisisSiempre(this);fijarTamanoBotonDroidfish(this);});
  var appChoices=document.querySelectorAll('.app-choice');
  for(var c=0;c<appChoices.length;c++) appChoices[c].addEventListener('click',function(){var frame=document.getElementById('app-frame-'+this.getAttribute('data-app'));bloquearZoomFrame(frame);bloquearScrollHorizontalFrame(frame);mostrarControlesAnalisisSiempre(frame);fijarTamanoBotonDroidfish(frame);});
  bloquearZoomFrame(document.getElementById('app-frame-1'));
  bloquearScrollHorizontalFrame(document.getElementById('app-frame-1'));
  mostrarControlesAnalisisSiempre(document.getElementById('app-frame-1'));
  fijarTamanoBotonDroidfish(document.getElementById('app-frame-1'));
})();
</script>
<div class="tuto" id="tuto" aria-hidden="true">
  <div class="tuto-velo"></div>
  <div class="tuto-foco" id="tuto-foco"></div>
  <span class="tuto-ficha" id="tuto-ficha" aria-hidden="true">♞</span>
  <span class="tuto-mano" id="tuto-mano" aria-hidden="true">👆</span>
  <section class="tuto-card abajo" id="tuto-card" role="dialog" aria-modal="false" aria-labelledby="tuto-titulo">
    <span class="tuto-paso" id="tuto-paso">Paso 1</span>
    <h3 id="tuto-titulo">Bienvenido</h3>
    <p id="tuto-texto"></p>
    <div class="tuto-puntos" id="tuto-puntos"></div>
    <div class="tuto-acciones">
      <button class="tuto-cerrar" id="tuto-cerrar" type="button">Cerrar tutorial</button>
      <button class="tuto-atras" id="tuto-atras" type="button">Atrás</button>
      <button class="tuto-sig" id="tuto-sig" type="button">Siguiente</button>
    </div>
  </section>
</div>
<script type="module" src="pc-cloud-sync.js?v=2"></script>
<script>
/* ==================================================================
   Tutorial de bienvenida
   - Solo aparece a quien entra por primera vez y no tiene historial.
   - Si la persona escribe su código y se recupera su historial,
     el tutorial no aparece (o se cierra si ya estaba abierto).
   ================================================================== */
(function(){
  var KEY='pc_tutorial_visto_v1';
  var raiz=document.getElementById('tuto');
  var foco=document.getElementById('tuto-foco');
  var mano=document.getElementById('tuto-mano');
  var ficha=document.getElementById('tuto-ficha');
  var card=document.getElementById('tuto-card');
  var elPaso=document.getElementById('tuto-paso');
  var elTitulo=document.getElementById('tuto-titulo');
  var elTexto=document.getElementById('tuto-texto');
  var elPuntos=document.getElementById('tuto-puntos');
  var bAtras=document.getElementById('tuto-atras');
  var bSig=document.getElementById('tuto-sig');
  var bCerrar=document.getElementById('tuto-cerrar');
  var abierto=false,paso=0,reloj=null,vigia=null,estable=0;

  var PASOS=[
    {titulo:'Bienvenido a PC de L1 y L2',texto:'Dos métodos de ajedrez en una sola app. En menos de un minuto te muestro qué tocar.',modo:'saludo'},
    {titulo:'Elige tu método',texto:'Con este botón abres el menú y cambias entre PC de L1 (ejercicios tácticos) y PC de L2 (ejercicios posicionales).',padre:'menu-button',modo:'toque'},
    {titulo:'¿Quién juega?',texto:'Aquí ves el número del ejercicio, su dificultad y qué bando mueve: «Juegan: Blancas» o «Juegan: Negras».',app:'toplay',modo:'toque'},
    {titulo:'Juega sobre el tablero',texto:'Toca una de tus piezas y arrástrala, o toca la casilla de destino. Si es la jugada correcta, el rival responde solo.',app:'board',modo:'arrastre'},
    {titulo:'Más espacio',texto:'«Ocultar» esconde el encabezado de arriba para que el tablero tenga más espacio. «Mostrar» lo vuelve a poner.',app:'b-banner',modo:'toque'},
    {titulo:'Analiza con Stockfish',texto:'El botón del chip enciende Stockfish, el motor de ajedrez: te da la evaluación de la posición y la mejor línea.',app:'b-edit',modo:'toque'},
    {titulo:'Tus botones',texto:'💡 ilumina la pieza que debes mover, «Solución» reproduce la línea completa, «Girar» voltea el tablero, el parlante activa o silencia el sonido, el libro abre la explicación y el último botón comparte la posición.',app:'pc-fila-controles',modo:'toque'},
    {titulo:'Tu mascota',texto:'Cada vez que resuelves un ejercicio aparece tocando guitarra sobre el tablero. Arrástrala con el dedo para moverla, tócala y levantará su guitarra como estrella de rock, y dale doble toque para cerrarla.',app:'pc-mascota',mascota:true,modo:'toque'},
    {titulo:'Tu entrenamiento',texto:'Aquí ves tu meta diaria, tu racha y el cuaderno de errores para repasar los ejercicios que te costaron.',app:'b-gift',modo:'toque'},
    {titulo:'Tu código de progreso',texto:'Este botón guarda tu avance en la nube con tu código. En otro dispositivo, escribe el mismo código y recuperas todo.',padre:'pc-sync-fab',modo:'toque'},
    {titulo:'¡Listo para entrenar!',texto:'Resuelve, repite y acelera. Puedes volver a ver esta guía desde el menú, en «Ver tutorial».',modo:'saludo',final:true}
  ];


  function leer(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function visto(){return leer(KEY)==='1';}
  function marcarVisto(){try{localStorage.setItem(KEY,'1');}catch(e){}}
  function listaLlena(k){
    try{var v=JSON.parse(leer(k)||'null');if(!v)return false;if(Array.isArray(v))return v.length>0;return typeof v==='object'&&Object.keys(v).length>0;}catch(e){return false;}
  }
  function tieneHistorial(){
    return listaLlena('wp_solved')||listaLlena('wp2_solved')||listaLlena('wp_hist_log')||listaLlena('wp2_hist_log');
  }
  function frameActivo(){return document.querySelector('.app-frame.active');}
  function docApp(){try{var f=frameActivo();return f&&f.contentDocument;}catch(e){return null;}}
  function appLista(){var d=docApp();return !!(d&&d.readyState==='complete'&&d.getElementById('board'));}
  function syncAbierto(){var bg=document.getElementById('pc-sync-modal-bg');return !!(bg&&bg.classList.contains('open'));}
  function menuAbierto(){var b=document.getElementById('drawer-backdrop');return !!(b&&b.classList.contains('open'));}

  function objetivo(p){
    var el=null;
    if(p.padre) el=document.getElementById(p.padre);
    else if(p.app){var d=docApp();el=d&&d.getElementById(p.app);}
    if(!el)return null;
    var r=el.getBoundingClientRect();
    if(!r.width||!r.height)return null;
    if(p.app){
      var f=frameActivo(),fr=f?f.getBoundingClientRect():{left:0,top:0};
      if(r.bottom<0||r.top>window.innerHeight){try{el.scrollIntoView({block:'center'});}catch(e){}r=el.getBoundingClientRect();}
      return {left:r.left+fr.left,top:r.top+fr.top,width:r.width,height:r.height};
    }
    return {left:r.left,top:r.top,width:r.width,height:r.height};
  }

  function colocar(){
    if(!abierto)return;
    var p=PASOS[paso],o=(p.padre||p.app)?objetivo(p):null;
    var W=window.innerWidth,H=window.innerHeight;
    mano.className='tuto-mano';ficha.className='tuto-ficha';
    if(o){
      var m=6;
      foco.style.left=(o.left-m)+'px';foco.style.top=(o.top-m)+'px';
      foco.style.width=(o.width+m*2)+'px';foco.style.height=(o.height+m*2)+'px';
      raiz.classList.add('con-foco');
      var cx=o.left+o.width/2,cy=o.top+o.height/2;
      card.className='tuto-card '+(cy>H*0.55?'arriba':'abajo');
      if(p.modo==='arrastre'){
        var x1=o.left+o.width*0.35,y1=o.top+o.height*0.78,x2=o.left+o.width*0.35,y2=o.top+o.height*0.5;
        mano.style.setProperty('--x',x1+'px');mano.style.setProperty('--y',y1+'px');
        mano.style.setProperty('--x2',x2+'px');mano.style.setProperty('--y2',y2+'px');
        ficha.style.setProperty('--x',x1+'px');ficha.style.setProperty('--y',y1+'px');
        ficha.style.setProperty('--x2',x2+'px');ficha.style.setProperty('--y2',y2+'px');
        mano.className='tuto-mano ver arrastre';ficha.className='tuto-ficha ver';
      }else{
        var y=Math.min(cy+o.height*0.15,H-60);
        mano.style.setProperty('--x',cx+'px');mano.style.setProperty('--y',y+'px');
        mano.className='tuto-mano ver toque';
      }
    }else{
      raiz.classList.remove('con-foco');
      card.className='tuto-card centro';
      mano.style.setProperty('--x',(W/2)+'px');
      mano.style.setProperty('--y',Math.max(40,H/2-card.offsetHeight/2-70)+'px');
      mano.className='tuto-mano ver saludo';
    }
  }

  /* En el paso de la mascota, la mostramos de verdad sobre el tablero */
  var mascotaDelTuto=false;
  function mascotaTuto(mostrar){
    try{
      var f=frameActivo(),w=f&&f.contentWindow,m=w&&w.pcMascota;
      if(!m)return;
      if(mostrar&&!mascotaDelTuto){
        var d=docApp(),b=d&&d.getElementById('board');
        if(b)try{b.scrollIntoView({block:'center'});}catch(e){}
        m.mostrar();mascotaDelTuto=true;
      }else if(!mostrar&&mascotaDelTuto){m.quitar();mascotaDelTuto=false;}
    }catch(e){}
  }

  function pintar(){
    var p=PASOS[paso];
    mascotaTuto(!!p.mascota);
    elPaso.textContent='Paso '+(paso+1)+' de '+PASOS.length;
    elTitulo.textContent=p.titulo;elTexto.textContent=p.texto;
    var h='';for(var i=0;i<PASOS.length;i++)h+='<i'+(i===paso?' class="on"':'')+'></i>';
    elPuntos.innerHTML=h;
    bAtras.disabled=paso===0;
    bSig.textContent=p.final?'Empezar':'Siguiente';
    colocar();
  }

  function abrir(desde){
    if(abierto)return;
    abierto=true;paso=desde||0;
    raiz.classList.add('open');raiz.setAttribute('aria-hidden','false');
    pintar();
    clearInterval(reloj);reloj=setInterval(function(){
      if(tieneHistorial()&&!raiz.dataset.manual){cerrar();return;}
      raiz.style.visibility=syncAbierto()?'hidden':'';
      colocar();
    },700);
  }
  function cerrar(){
    if(!abierto)return;
    abierto=false;marcarVisto();delete raiz.dataset.manual;
    mascotaTuto(false);
    clearInterval(reloj);
    raiz.classList.remove('open','con-foco');raiz.setAttribute('aria-hidden','true');raiz.style.visibility='';
  }
  window.PCTutorial={abrir:function(){raiz.dataset.manual='1';abrir(0);},cerrar:cerrar,abierto:function(){return abierto;}};

  bSig.onclick=function(){if(PASOS[paso].final){cerrar();return;}paso=Math.min(PASOS.length-1,paso+1);pintar();};
  bAtras.onclick=function(){paso=Math.max(0,paso-1);pintar();};
  bCerrar.onclick=cerrar;
  window.addEventListener('resize',function(){setTimeout(colocar,60);});

  var bVer=document.getElementById('drawer-tuto');
  if(bVer)bVer.onclick=function(){
    var bd=document.getElementById('drawer-backdrop'),mb=document.getElementById('menu-button');
    if(bd)bd.classList.remove('open');
    if(mb){mb.classList.remove('open');mb.setAttribute('aria-expanded','false');}
    setTimeout(function(){window.PCTutorial.abrir();},250);
  };

  /* El botón atrás de Android cierra primero el tutorial */
  var atrasOriginal=window.PC_ANDROID_BACK;
  window.PC_ANDROID_BACK=function(){
    if(abierto){cerrar();return true;}
    return typeof atrasOriginal==='function'?atrasOriginal():true;
  };

  /* Decide si mostrarlo: espera a que se cierre la ventana del código
     y a que cargue el tablero; si ya hay historial, no lo muestra. */
  if(visto())return;
  vigia=setInterval(function(){
    if(visto()){clearInterval(vigia);return;}
    if(tieneHistorial()){marcarVisto();clearInterval(vigia);return;}
    if(syncAbierto()||menuAbierto()||!appLista()){estable=0;return;}
    estable++;
    if(estable>=3){clearInterval(vigia);abrir(0);}
  },500);
})();
</script>
</body>
</html>
