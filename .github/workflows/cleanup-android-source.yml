name: Cleanup Android source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-android-source.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore clean Android source
        run: |
          git clone --depth=1 https://github.com/la86926/PC-de-LuisA3-borrador.git /tmp/pc-source
          rm -rf android-app
          cp -R /tmp/pc-source/android-app android-app
      - name: Commit clean source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android-app
          git diff --cached --quiet || git commit -m "Limpiar artefactos de compilación Android"
          git push origin HEAD:main
