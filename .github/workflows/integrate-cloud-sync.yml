name: Integrate cloud sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/integrate-cloud-sync.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check pc-frame-cloud-bridge.js
          node --check pc-cloud-sync.js

      - name: Integrate cloud sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="pc-cloud-sync.css?v=1">'
          js='<script type="module" src="pc-cloud-sync.js?v=1"></script>'
          if css not in text:
              if '</head>' not in text: raise SystemExit('No se encontro </head>')
              text=text.replace('</head>', css+'\n</head>', 1)
          if js not in text:
              if '</body>' not in text: raise SystemExit('No se encontro </body>')
              text=text.replace('</body>', js+'\n</body>', 1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Verify integration
        run: |
          grep -F 'pc-cloud-sync.css?v=1' index.html
          grep -F 'pc-cloud-sync.js?v=1' index.html

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: enable one-code cloud sync for L1 and L2" || exit 0
          git push
