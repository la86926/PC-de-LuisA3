name: Verify Firebase key

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/find-firebase-key.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check visually ambiguous key characters
        run: |
          python3 - <<'PY'
          import itertools, json, urllib.request, urllib.error, time
          base=list('AIzaSyCGcl98D7288m_iy0Wlc_ffTISg85-LVpw')
          variants={9:['l','I','1'],21:['0','O','o'],23:['l','I','1'],29:['I','l','1']}
          found=None
          tried=0
          for vals in itertools.product(*(variants[i] for i in variants)):
              chars=base[:]
              for i,v in zip(variants,vals): chars[i]=v
              key=''.join(chars); tried+=1
              req=urllib.request.Request(
                  'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+key,
                  data=b'{"returnSecureToken":true}',
                  headers={'Content-Type':'application/json','Origin':'https://la86926.github.io'},
                  method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=10) as r:
                      data=json.load(r)
                      if data.get('idToken'):
                          found=key
                          break
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  try: msg=json.loads(body).get('error',{}).get('message','')
                  except: msg=''
                  if msg and 'API key not valid' not in msg:
                      # A recognized key with another service-level response is also the candidate.
                      found=key
                      break
              time.sleep(.05)
          with open('.firebase-key-report.txt','w') as f:
              f.write('tried='+str(tried)+'\n')
              f.write('found='+(found or 'NONE')+'\n')
          if not found:
              raise SystemExit('No valid variant found')
          PY
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .firebase-key-report.txt || true
          git commit -m "test: record Firebase key verification" || exit 0
          git push
