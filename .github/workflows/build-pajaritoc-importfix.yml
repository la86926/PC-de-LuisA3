name: Build PajaritoC import-fix APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pajaritoc-importfix.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Use independent package id
        run: |
          python3 - <<'PY'
          p='android-app/app/build.gradle'
          s=open(p,encoding='utf-8').read()
          s=s.replace("applicationId 'com.luis.pajaritoc'", "applicationId 'com.luis.pajaritoc.importfix'")
          s=s.replace('versionCode 1', 'versionCode 3')
          s=s.replace("versionName '1'", "versionName '3'")
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -q "applicationId 'com.luis.pajaritoc.importfix'" android-app/app/build.gradle
          grep -q 'setAllowContentAccess(true)' android-app/app/src/main/java/com/luis/pajaritoc/MainActivity.java
          grep -q 'onShowFileChooser' android-app/app/src/main/java/com/luis/pajaritoc/MainActivity.java
          grep -q 'setWebChromeClient' android-app/app/src/main/java/com/luis/pajaritoc/MainActivity.java

      - name: Prepare offline web assets
        run: |
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/drawable
          cp index.html index1.html index2.html android-app/app/src/main/assets/
          cp -f *.png android-app/app/src/main/assets/ || true
          cp -f *.mp3 android-app/app/src/main/assets/ || true
          cp -f *.js android-app/app/src/main/assets/ || true
          cp -f *.wasm android-app/app/src/main/assets/ || true
          cp torre.png android-app/app/src/main/res/drawable/torre.png

      - name: Build APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.luis.pajaritoc.importfix'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "application-label:'PajaritoC'"
          cp "$APK" PajaritoC-importar-corregido.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PajaritoC-importar-corregido
          path: PajaritoC-importar-corregido.apk
          if-no-files-found: error
          retention-days: 30
