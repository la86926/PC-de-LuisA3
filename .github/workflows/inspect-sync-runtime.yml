name: Inspect sync runtime

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-sync-runtime.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract runtime helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles = [
            'function fnState()',
            'function applyPageState',
            'function restoreUi',
            'function jumpToNumber',
            'function renderProgress()',
            'function loadSolved()',
            'function buildList()',
            'function load(p)',
            'let trainingGoal=',
            'let errorBook=',
          ]
          out=[]
          for filename in ('index1.html','index2.html'):
            text=Path(filename).read_text(encoding='utf-8',errors='replace')
            out.append('===== '+filename+' =====')
            for needle in needles:
              start=0
              found=0
              while True:
                i=text.find(needle,start)
                if i<0: break
                found+=1
                a=max(0,i-200); b=min(len(text),i+2600)
                out.append('\n--- '+needle+' #'+str(found)+' ---\n'+text[a:b])
                start=i+len(needle)
            out.append('')
          Path('.sync-runtime-report.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sync-runtime-report.txt
          git commit -m "chore: add sync runtime inspection report" || exit 0
          git push
