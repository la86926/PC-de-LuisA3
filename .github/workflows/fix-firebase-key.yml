name: Fix Firebase key

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-firebase-key.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct config and cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pc-cloud-sync.js')
          s=p.read_text(encoding='utf-8')
          old='AIzaSyCGcl98D7288m_iy0Wlc_ffTISg85-LVpw'
          new='AIzaSyCGcl98D7288m_iyOWlc_ffTISg85-LVpw'
          if old not in s and new not in s: raise SystemExit('API key not found')
          s=s.replace(old,new)
          s=s.replace("pc-frame-cloud-bridge.js',location.href).href+'?v=1'","pc-frame-cloud-bridge.js',location.href).href+'?v=2'")
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('pc-cloud-sync.js?v=1','pc-cloud-sync.js?v=2')
          p.write_text(s,encoding='utf-8')
          PY
          node --check pc-cloud-sync.js
          node --check pc-frame-cloud-bridge.js
          grep -Fq 'pc-cloud-sync.js?v=2' index.html
          grep -Fq 'iyOWlc' pc-cloud-sync.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pc-cloud-sync.js
          git commit -m "fix: correct Firebase config for cloud sync" || exit 0
          git push
