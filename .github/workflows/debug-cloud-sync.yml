name: Debug cloud sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/debug-cloud-sync.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Firebase
        env:
          FIREBASE_API_KEY: AIzaSyCGcl98D7288m_iy0Wlc_ffTISg85-LVpw
        run: |
          set +e
          REPORT=.cloud-debug-report.txt
          : > "$REPORT"
          COMMON=(-H 'Content-Type: application/json' -H 'Origin: https://la86926.github.io' -H 'Referer: https://la86926.github.io/PC-de-LuisA3/')
          AUTH_STATUS=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X POST "${COMMON[@]}" --data '{"returnSecureToken":true}' "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}")
          echo "auth_status=${AUTH_STATUS}" >> "$REPORT"
          python3 - <<'PY' >> "$REPORT"
          import json
          try:
              x=json.load(open('/tmp/auth.json'))
              if 'error' in x: print('auth_error='+str(x['error'].get('message','unknown')))
              else: print('auth_has_token='+str(bool(x.get('idToken'))).lower())
          except Exception as e: print('auth_parse_error='+str(e))
          PY
          TOKEN=$(python3 - <<'PY'
          import json
          try: print(json.load(open('/tmp/auth.json')).get('idToken',''))
          except: print('')
          PY
          )
          if [ -n "$TOKEN" ]; then
            TEST_ID="syncsystemtest$(date +%s)"
            TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            DOC_URL="https://firestore.googleapis.com/v1/projects/chess86926/databases/(default)/documents/progresos/${TEST_ID}"
            BODY=$(cat <<JSON
          {"fields":{"l1":{"mapValue":{"fields":{"storage":{"mapValue":{"fields":{}}},"page":{"mapValue":{"fields":{}}}}}},"l2":{"mapValue":{"fields":{"storage":{"mapValue":{"fields":{}}},"page":{"mapValue":{"fields":{}}}}}},"timestamp":{"timestampValue":"${TS}"},"updatedBy":{"stringValue":"github-actions-test"},"schemaVersion":{"integerValue":"1"}}}
          JSON
            )
            PATCH_STATUS=$(curl -sS -o /tmp/patch.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' --data "$BODY" "$DOC_URL")
            echo "patch_status=${PATCH_STATUS}" >> "$REPORT"
            python3 - <<'PY' >> "$REPORT"
          import json
          try:
              x=json.load(open('/tmp/patch.json'))
              if 'error' in x: print('patch_error='+str(x['error'].get('message','unknown')).replace('\n',' '))
              else: print('patch_created=true')
          except Exception as e: print('patch_parse_error='+str(e))
          PY
            GET_STATUS=$(curl -sS -o /tmp/get.json -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "$DOC_URL")
            echo "get_status=${GET_STATUS}" >> "$REPORT"
            DELETE_STATUS=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer ${TOKEN}" "$DOC_URL")
            echo "delete_status=${DELETE_STATUS}" >> "$REPORT"
          fi
      - name: Commit diagnosis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cloud-debug-report.txt
          git commit -m "test: update Firebase sync diagnosis" || exit 0
          git push
