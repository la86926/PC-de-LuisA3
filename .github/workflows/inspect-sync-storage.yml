name: Inspect sync storage

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-sync-storage.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect storage usage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          out = []
          for filename in ('index1.html', 'index2.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8', errors='replace')
              out.append(f'===== {filename} =====')
              out.append(f'bytes={len(text.encode("utf-8"))} chars={len(text)}')

              patterns = [
                  r'localStorage', r'sessionStorage', r'indexedDB',
                  r'getItem\s*\(', r'setItem\s*\(', r'removeItem\s*\(',
                  r'addEventListener\s*\(\s*["\']storage["\']',
                  r'favorit', r'historial', r'respuesta', r'ajuste',
                  r'ejercicio', r'progreso', r'save', r'load'
              ]

              seen = set()
              for pat in patterns:
                  matches = list(re.finditer(pat, text, re.I))
                  out.append(f'PATTERN {pat}: {len(matches)}')
                  for m in matches[:80]:
                      a = max(0, m.start()-260)
                      b = min(len(text), m.end()+420)
                      snippet = text[a:b].replace('\r',' ').replace('\n',' ')
                      snippet = re.sub(r'\s+', ' ', snippet)
                      key = (pat, snippet)
                      if key not in seen:
                          seen.add(key)
                          out.append(snippet)
              out.append('')

          Path('.sync-storage-report.txt').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sync-storage-report.txt
          git commit -m "chore: add sync storage inspection report" || exit 0
          git push
